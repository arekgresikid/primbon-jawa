<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X3W6CFLX4X"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-X3W6CFLX4X');
    </script>

    <!-- Google Search Console Verification -->
    <!-- Ganti 'KODE-VERIFIKASI-ANDA' dengan kode dari Google Search Console -->
    <meta name="google-site-verification" content="KODE-VERIFIKASI-ANDA" />

    <title>Primbon Jawa Modern</title>

    <!-- Theme Color for Mobile -->
    <meta name="theme-color" content="#0c0a09" />

    <!-- Blocking script to prevent Dark Mode Flash -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('primbon-theme');
          // Default ke dark jika belum ada pilihan di localStorage
          if (theme === 'dark' || (!theme)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
